# Unidad II, Actividad 7 — Balances por cuenta y balance general.
# Encabezado HTTP en GraphiQL: {"Authorization": "Bearer TOKEN_QUE_DEVOLVIO_LOGIN"}
# Variables en variables/: banco.json, caja.json, ahorro.json, banco_28.json, general.json.
# Ejecuta un solo nombre de operación a la vez.

mutation IniciarSesion($email: String!, $password: String!) {
  login(input: { email: $email, password: $password }) {
    tokenType
    token
    user { name }
  }
}

# Variables: banco.json, caja.json, ahorro.json o banco_28.json
query BalanceDeUnaCuenta($accountId: ID!, $from: Date!, $to: Date!) {
  accountBalance(accountId: $accountId, fromDate: $from, toDate: $to) {
    accountId
    accountName
    isActive
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    isInRed
  }
}

# Variables: general.json
query BalanceDeLaEmpresa($from: Date!, $to: Date!) {
  generalBalance(fromDate: $from, toDate: $to) {
    companyId
    currency
    fromDate
    toDate
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    isInRed
    accountsInRed
    accounts {
      accountId
      accountName
      isActive
      openingBalance
      totalIncome
      totalExpense
      profit
      closingBalance
      isInRed
    }
  }
}

# transactionDate es la fecha de operación (con zona, se guarda en UTC); capturedAt lo asigna el servidor.
# Ejemplo: {"accountId": "1", "conceptId": "2", "type": "EXPENSE", "amount": "1200.00",
#           "date": "2026-10-27T12:00:00Z", "description": "Pago de renta"}
mutation RegistrarMovimiento(
  $accountId: ID!, $conceptId: ID!, $type: TransactionType!, $amount: Decimal!, $date: Time, $description: String
) {
  createTransaction(input: {
    accountId: $accountId, conceptId: $conceptId, transactionType: $type,
    amount: $amount, transactionDate: $date, shortDescription: $description
  }) {
    id
    transactionType
    amount
    transactionDate
    capturedAt
  }
}
