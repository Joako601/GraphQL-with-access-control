query ExplorarCatalogo($actor: ID!) {
  cuentas: permissionCatalog(resource: ACCOUNTS, actorCompanyUserId: $actor) { ...DatosPermiso }
  movimientos: permissionCatalog(resource: TRANSACTIONS, actorCompanyUserId: $actor) { ...DatosPermiso }
}

query CatalogoCompleto($actor: ID!) {
  permissionCatalog(actorCompanyUserId: $actor) { id code name isActive }
}

query RolesYPermisos {
  roles(activeOnly: true) { id code name isActive }
  permissions(activeOnly: true) { id code name isActive }
}

query PermisosDelRol($roleId: ID!) {
  rolePermissions(roleId: $roleId) {
    id isActive
    permission { id code isActive }
  }
}

query RevisarConfiguracion($actor: ID!, $input: SetRolePermissionsInput!) {
  previewRolePermissions(input: $input, actorCompanyUserId: $actor) {
    role { id code }
    current { id code }
    toActivate { id code }
    toDeactivate { id code }
    unchanged { id code }
    finalCount
  }
}

mutation AplicarConfiguracion($actor: ID!, $input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input, actorCompanyUserId: $actor) {
    role { id code }
    activated { id code }
    deactivated { id code }
    unchanged { id code }
    finalCount
    changed
  }
}

fragment DatosPermiso on Permission { id code name }


# E10: continuidad del proyecto
query ConsultarCuentasE10($actor: ID!, $company: ID!) {
  accounts(actorCompanyUserId: $actor, companyId: $company) { id name }
}

mutation CrearCuentaE10($actor: ID!, $input: CreateAccountInput!) {
  createAccount(actorCompanyUserId: $actor, input: $input) { id name }
}

mutation CrearConceptoE10($actor: ID!, $input: CreateConceptInput!) {
  createConcept(actorCompanyUserId: $actor, input: $input) { id name }
}

mutation AsociarConceptoE10($actor: ID!, $input: AssignConceptToAccountInput!) {
  assignConceptToAccount(actorCompanyUserId: $actor, input: $input) { id isActive }
}

mutation RegistrarMovimientoE10($actor: ID!, $input: CreateTransactionInput!) {
  createTransaction(actorCompanyUserId: $actor, input: $input) { id accountId conceptId transactionType amount isActive }
}
