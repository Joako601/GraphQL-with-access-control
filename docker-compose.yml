name: unidad2-actividad4

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: unidad2-actividad4-api

    ports:
      - "127.0.0.1:${APP_PORT}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}

    restart: unless-stopped


  postgres:
    image: postgres:16

    container_name: unidad2-actividad4-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea las tablas automáticamente la primera vez que se levanta el contenedor
      - ./database.sql:/docker-entrypoint-initdb.d/01_database.sql
      # Actividad 4: cuentas, conceptos y movimientos (se ejecuta después de database.sql)
      - ./database_finanzas.sql:/docker-entrypoint-initdb.d/02_database_finanzas.sql
      - ./database_roles.sql:/docker-entrypoint-initdb.d/03_database_roles.sql

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4

    container_name: unidad2-actividad4-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5054:80"

    depends_on:
      - postgres

    restart: unless-stopped


volumes:
  postgres_data:
