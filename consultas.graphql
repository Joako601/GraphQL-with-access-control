# Pedro no registra movimientos como CONSULTA
# Actor: Pedro
# Variables: {"actor": "5", "input": {"accountId": "1", "conceptId": "1", "transactionType": "INCOME", "amount": "1500.00", "shortDescription": "Movimiento de Pedro"}}
mutation RegistrarMovimiento($actor: ID!, $input: CreateTransactionInput!) {
  createTransaction(actorCompanyUserId: $actor, input: $input) {
    id
    amount
    capturedByUser { name }
    account { name }
  }
}

# Ana cambia a Pedro de CONSULTA a CAPTURISTA
# Actor: Ana
# Variables: {"actor": "1", "input": {"companyUserId": "5", "roleId": "3"}}
mutation CambiarPuesto($actor: ID!, $input: AssignRoleInput!) {
  assignRole(actorCompanyUserId: $actor, input: $input) {
    id
    isActive
    role { code }
    companyUser { id user { name } }
  }
}

