# Una empresa y los cinco puestos iniciales
# Actor: Ana
# Variables: {"actor": "1", "empresa": "1"}
query Personas($actor:ID!,$empresa:ID!){
  companyUsers(actorCompanyUserId:$actor,companyId:$empresa){
    id
    isAdmin
    user { name }
    role { code }
  }
}

# Los cuatro roles del catálogo
# Actor: catálogo público
# Variables: {}
{ roles { id code isActive } }

# Los diez permisos del catálogo
# Actor: catálogo público
# Variables: {}
{ permissions { id code isActive } }

# Lista inicial de ADMINISTRADOR
# Actor: catálogo público
# Variables: {"rol": "1"}
query PermisosDelRol($rol: ID!) {
  rolePermissions(roleId: $rol) {
    id
    isActive
    permission { code }
  }
}

